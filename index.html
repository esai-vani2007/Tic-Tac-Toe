<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    /* ---------- Theme ---------- */
    :root {
      --bg-start: #1e3c72;
      --bg-end: #7b2ff7;
      --card: #ffffff;
      --text: #2d3047;
      --muted: #7a7f9d;
      --x-color: #ff5e7e;
      --x-soft: #ffe3ea;
      --o-color: #1fb8b0;
      --o-soft: #d9f7f5;
      --cell-bg: #f5f6fb;
      --cell-hover: #eceef8;
      --line: #dfe2ef;
      --win: #fff4c2;
      --win-border: #f7b733;
      --accent: #7b2ff7;
      --radius: 20px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 430px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      padding: 26px;
      text-align: center;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 1.9rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--x-color), var(--accent), var(--o-color));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .section-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 0 0 8px;
    }

    /* ---------- Segmented controls (mode + mark) ---------- */
    .segment {
      display: inline-flex;
      background: #f0f1f8;
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .seg-btn:hover { color: var(--text); }

    .seg-btn[aria-pressed="true"] {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(123, 47, 247, 0.35);
    }

    .mark-x[aria-pressed="true"] { background: var(--x-color); box-shadow: 0 4px 12px rgba(255, 94, 126, 0.35); }
    .mark-o[aria-pressed="true"] { background: var(--o-color); box-shadow: 0 4px 12px rgba(31, 184, 176, 0.35); }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 18px;
    }

    .control-group { display: flex; flex-direction: column; align-items: center; }

    /* ---------- Scoreboard ---------- */
    .scoreboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .score {
      border-radius: 14px;
      padding: 12px 6px;
      background: #f5f6fb;
    }

    .score.x { background: var(--x-soft); }
    .score.o { background: var(--o-soft); }

    .score-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 700;
    }

    .score-value {
      font-size: 1.6rem;
      font-weight: 800;
    }

    .score.x .score-label, .score.x .score-value { color: var(--x-color); }
    .score.o .score-label, .score.o .score-value { color: var(--o-color); }

    /* ---------- Status ---------- */
    .status {
      min-height: 2.2em;
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0 0 14px;
    }

    /* ---------- Board ---------- */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      aspect-ratio: 1 / 1;
      margin: 0 auto 22px;
      max-width: 340px;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cell-bg);
      border: 2px solid var(--line);
      border-radius: 16px;
      cursor: pointer;
      font-size: clamp(2.2rem, 10vw, 3.4rem);
      font-weight: 800;
      padding: 0;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
    }

    .cell:hover:not(:disabled) {
      background: var(--cell-hover);
      transform: translateY(-2px);
    }

    .cell:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .cell:disabled { cursor: default; }

    .cell.x { color: var(--x-color); background: var(--x-soft); border-color: transparent; }
    .cell.o { color: var(--o-color); background: var(--o-soft); border-color: transparent; }

    .cell.win {
      background: var(--win);
      border: 2px solid var(--win-border);
      box-shadow: 0 0 14px rgba(247, 183, 51, 0.6);
    }

    /* Pop-in animation when a mark appears */
    .mark {
      display: inline-block;
      animation: pop 0.3s ease-out;
    }

    @keyframes pop {
      0% { transform: scale(0.3); opacity: 0; }
      70% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }

    /* ---------- Buttons ---------- */
    .new-game {
      border: none;
      background: linear-gradient(90deg, var(--x-color), var(--accent));
      color: #ffffff;
      padding: 13px 32px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(123, 47, 247, 0.3);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .new-game:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(123, 47, 247, 0.4);
    }

    .new-game:focus-visible,
    .seg-btn:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .hint {
      margin-top: 16px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .mark { animation: none; }
      * { transition: none !important; }
    }

    @media (max-width: 380px) {
      .app { padding: 18px; }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Tic Tac Toe</h1>

    <div class="controls">
      <div class="control-group">
        <p class="section-label">Game mode</p>
        <div class="segment" role="group" aria-label="Game mode">
          <button class="seg-btn" id="mode-two" aria-pressed="true">Two Players</button>
          <button class="seg-btn" id="mode-cpu" aria-pressed="false">vs Computer</button>
        </div>
      </div>

      <div class="control-group">
        <p class="section-label">Choose your mark</p>
        <div class="segment" role="group" aria-label="Choose your mark">
          <button class="seg-btn mark-x" id="pick-x" aria-pressed="true">Play as X</button>
          <button class="seg-btn mark-o" id="pick-o" aria-pressed="false">Play as O</button>
        </div>
      </div>
    </div>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score x">
        <div class="score-label" id="label-x">X</div>
        <div class="score-value" id="score-x">0</div>
      </div>
      <div class="score">
        <div class="score-label">Draws</div>
        <div class="score-value" id="score-draw">0</div>
      </div>
      <div class="score o">
        <div class="score-label" id="label-o">O</div>
        <div class="score-value" id="score-o">0</div>
      </div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <div class="board" id="board" role="group" aria-label="Tic Tac Toe board"></div>

    <button class="new-game" id="new-game">New Game</button>

    <p class="hint">Click a square, or use Tab and Enter or Space to play.</p>
  </main>

  <script>
    /* =========================================================
       GAME LOGIC (no DOM code in this section)
       ========================================================= */

    const WIN_LINES = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
      [0, 4, 8], [2, 4, 6]             // diagonals
    ];

    /** Fresh game state. The given mark moves first. */
    function createGame(starter = 'X') {
      return {
        board: Array(9).fill(null),
        current: starter,
        winner: null,   // 'X' | 'O' | 'draw' | null while playing
        winLine: null,  // indices of the winning cells, if any
        over: false
      };
    }

    /** Returns the new state after a move, or the same state if the move is illegal. */
    function makeMove(state, index) {
      if (state.over || state.board[index] !== null) return state;

      const board = state.board.slice();
      board[index] = state.current;

      const line = findWinningLine(board);
      if (line) {
        return { ...state, board, winner: board[line[0]], winLine: line, over: true };
      }
      if (board.every(cell => cell !== null)) {
        return { ...state, board, winner: 'draw', winLine: null, over: true };
      }
      return { ...state, board, current: state.current === 'X' ? 'O' : 'X' };
    }

    /** Returns the first winning line on the board, or null. */
    function findWinningLine(board) {
      for (const line of WIN_LINES) {
        const [a, b, c] = line;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return line;
        }
      }
      return null;
    }

    /** Indices of all empty cells. */
    function emptyCells(board) {
      return board.map((v, i) => (v === null ? i : null)).filter(i => i !== null);
    }

    /** Random empty cell for the computer opponent. */
    function pickComputerMove(board) {
      const options = emptyCells(board);
      return options[Math.floor(Math.random() * options.length)];
    }

    /* =========================================================
       RENDERING AND CONTROL (DOM code lives here)
       ========================================================= */

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const newGameBtn = document.getElementById('new-game');
    const modeTwoBtn = document.getElementById('mode-two');
    const modeCpuBtn = document.getElementById('mode-cpu');
    const pickXBtn = document.getElementById('pick-x');
    const pickOBtn = document.getElementById('pick-o');
    const labelX = document.getElementById('label-x');
    const labelO = document.getElementById('label-o');
    const scoreEls = {
      X: document.getElementById('score-x'),
      O: document.getElementById('score-o'),
      draw: document.getElementById('score-draw')
    };

    const scores = { X: 0, O: 0, draw: 0 };
    let state = createGame();
    let vsComputer = false;
    let humanMark = 'X';       // the mark the player chose
    let computerTimer = null;
    let lastWinner = null;     // 'X' | 'O' | null (null after a draw or at the start)
    let lastStarter = 'X';     // who opened the previous round

    // Build the 9 cells once. Each is a real <button>, so keyboard play works natively.
    const cells = [];
    for (let i = 0; i < 9; i++) {
      const btn = document.createElement('button');
      btn.className = 'cell';
      btn.type = 'button';
      btn.addEventListener('click', () => handleHumanMove(i));
      boardEl.appendChild(btn);
      cells.push(btn);
    }

    /** The mark the computer plays, when playing against it. */
    function computerMark() {
      return humanMark === 'X' ? 'O' : 'X';
    }

    function isComputersTurn() {
      return vsComputer && state.current === computerMark();
    }

    function handleHumanMove(index) {
      if (isComputersTurn()) return; // ignore clicks during the computer's turn
      playMove(index);
    }

    function playMove(index) {
      const before = state;
      state = makeMove(state, index);
      if (state === before) return; // illegal move, nothing changed

      render();

      if (state.over) {
        recordResult(state.winner);
        return;
      }
      scheduleComputerMove();
    }

    function scheduleComputerMove() {
      clearTimeout(computerTimer);
      if (!isComputersTurn() || state.over) return;
      computerTimer = setTimeout(() => {
        playMove(pickComputerMove(state.board));
      }, 500);
    }

    function recordResult(result) {
      if (result === 'draw') {
        scores.draw++;
        lastWinner = null;
      } else {
        scores[result]++;
        lastWinner = result;
      }
      updateScores();
    }

    /**
     * Loser starts: the player who lost the last round opens the next one.
     * After a draw, the same player who opened the last round starts again.
     * The very first round starts with X.
     */
    function chooseStarter() {
      if (lastWinner === null) {
        return lastStarter; // first round (X) or after a draw
      }
      return lastWinner === 'X' ? 'O' : 'X';
    }

    function startNewGame() {
      clearTimeout(computerTimer);
      const starter = chooseStarter();
      lastStarter = starter;
      state = createGame(starter);
      render();
      scheduleComputerMove(); // if the computer is X, it opens the round
    }

    function updateScores() {
      scoreEls.X.textContent = scores.X;
      scoreEls.O.textContent = scores.O;
      scoreEls.draw.textContent = scores.draw;
    }

    function winnerName(mark) {
      if (!vsComputer) return `Player ${mark}`;
      return mark === humanMark ? 'You' : 'Computer';
    }

    function statusText() {
      if (state.winner === 'draw') return "It's a draw!";
      if (state.winner) return `${winnerName(state.winner)} wins!`;
      if (isComputersTurn()) return 'Computer is thinking…';
      if (vsComputer) return state.current === humanMark ? 'Your turn' : 'Computer is thinking…';
      return `Player ${state.current}'s turn`;
    }

    function render() {
      state.board.forEach((value, i) => {
        const btn = cells[i];
        const winCell = state.winLine && state.winLine.includes(i);

        btn.className = 'cell' + (value ? ' ' + value.toLowerCase() : '') + (winCell ? ' win' : '');
        btn.disabled = state.over || value !== null;

        if (value) {
          btn.innerHTML = `<span class="mark">${value}</span>`;
          btn.setAttribute('aria-label', `Cell ${i + 1}, ${value}`);
        } else {
          btn.textContent = '';
          btn.setAttribute('aria-label', `Cell ${i + 1}, empty`);
        }
      });

      statusEl.textContent = statusText();
      updateScores();
    }

    function updateLabels() {
      if (vsComputer) {
        labelX.textContent = humanMark === 'X' ? 'You (X)' : 'Computer (X)';
        labelO.textContent = humanMark === 'O' ? 'You (O)' : 'Computer (O)';
      } else {
        labelX.textContent = 'Player X';
        labelO.textContent = 'Player O';
      }
    }

    function setMode(computer) {
      vsComputer = computer;
      lastWinner = null;
      lastStarter = 'X';
      modeTwoBtn.setAttribute('aria-pressed', String(!computer));
      modeCpuBtn.setAttribute('aria-pressed', String(computer));
      updateLabels();
      startNewGame();
    }

    function setHumanMark(mark) {
      humanMark = mark;
      lastWinner = null;
      lastStarter = 'X';
      pickXBtn.setAttribute('aria-pressed', String(mark === 'X'));
      pickOBtn.setAttribute('aria-pressed', String(mark === 'O'));
      updateLabels();
      startNewGame();
    }

    newGameBtn.addEventListener('click', startNewGame);
    modeTwoBtn.addEventListener('click', () => setMode(false));
    modeCpuBtn.addEventListener('click', () => setMode(true));
    pickXBtn.addEventListener('click', () => setHumanMark('X'));
    pickOBtn.addEventListener('click', () => setHumanMark('O'));

    updateLabels();
    render();
  </script>
</body>
</html>
